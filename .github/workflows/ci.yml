name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check
      - name: Mypy
        run: uv run mypy src
      - name: Tests
        run: uv run pytest
      - name: Smoke run of reproduce on a simulated panel (no network)
        run: uv run python scripts/reproduce.py --fast --synthetic --out "$RUNNER_TEMP/tenor-smoke"
